name: Puerta de calidad

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Compilar, probar y verificar calidad
    runs-on: windows-latest
    env:
      SONAR_TOKEN: ${{ secrets['SONAR_TOKEN'] }}
      SONAR_ORGANIZATION: ${{ vars['SONAR_ORGANIZATION'] }}
      SONAR_PROJECT_KEY: ${{ vars['SONAR_PROJECT_KEY'] }}

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias fijadas
        run: npm ci

      - name: CONSTRUIR - compilar la aplicación
        run: npm run build

      - name: PROBAR - pruebas unitarias, integración controlada y regresión
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force coverage | Out-Null
          npm test 2>&1 | Tee-Object -FilePath coverage/test-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PROBAR - medir cobertura y aplicar umbrales
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force coverage | Out-Null
          npm run test:coverage 2>&1 | Tee-Object -FilePath coverage/coverage.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ANALIZAR - verificación estricta de TypeScript
        run: npm run typecheck

      - name: ANALIZAR - ESLint
        run: npm run lint

      - name: ANALIZAR - verificar formato con Prettier
        run: npm run format:check

      - name: ANALIZAR - SonarCloud (si está configurado)
        if: ${{ env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with:
          args: >-
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}

      - name: ANALIZAR - informar que SonarCloud no está configurado
        if: ${{ env.SONAR_ORGANIZATION == '' || env.SONAR_PROJECT_KEY == '' || env.SONAR_TOKEN == '' }}
        run: >-
          Write-Output 'Se omitió SonarCloud: configura las variables SONAR_ORGANIZATION y SONAR_PROJECT_KEY y el secreto SONAR_TOKEN.'

      - name: REPORTAR - guardar informes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quality-reports
          path: |
            coverage/coverage.txt
            coverage/test-results.log
          if-no-files-found: warn
