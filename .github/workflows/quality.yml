name: Puerta de calidad

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Compilar, probar y verificar calidad
    runs-on: windows-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias fijadas
        run: npm ci

      - name: CONSTRUIR - compilar la aplicación
        run: npm run build

      - name: PROBAR - pruebas unitarias, integración controlada y regresión
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force coverage | Out-Null
          npm test 2>&1 | Tee-Object -FilePath coverage/test-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PROBAR - recorrido E2E de Electron con SQLite aislado
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force coverage | Out-Null
          npm run test:e2e 2>&1 | Tee-Object -FilePath coverage/e2e-electron.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PROBAR - medir cobertura y aplicar umbrales
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force coverage | Out-Null
          npm run test:coverage 2>&1 | Tee-Object -FilePath coverage/coverage.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ANALIZAR - verificación estricta de TypeScript
        shell: pwsh
        run: |
          npm run typecheck 2>&1 | Tee-Object -FilePath coverage/typecheck.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ANALIZAR - ESLint
        shell: pwsh
        run: |
          npm run lint 2>&1 | Tee-Object -FilePath coverage/eslint.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ANALIZAR - verificar formato con Prettier
        shell: pwsh
        run: |
          npm run format:check 2>&1 | Tee-Object -FilePath coverage/format-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: REPORTAR - guardar informes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quality-reports
          path: |
            coverage/coverage.txt
            coverage/test-results.log
            coverage/e2e-electron.log
            coverage/typecheck.log
            coverage/eslint.log
            coverage/format-check.log
            coverage/lcov.info
          if-no-files-found: warn

      - name: ANALIZAR - SonarCloud
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
