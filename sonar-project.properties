# Sustituir SONAR_ORGANIZATION y SONAR_PROJECT_KEY mediante configuración de GitHub.
sonar.projectName=SoporteTecnico
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js
sonar.exclusions=src/renderer/vendor/**,dist/**,release/**,node_modules/**
sonar.typescript.tsconfigPath=tsconfig.json
# La cobertura nativa de node:test no produce LCOV en la configuración actual.
